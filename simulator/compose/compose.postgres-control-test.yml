name: pilot107-postgres-control-test

services:
  postgres-control-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pilot107_control_test
      POSTGRES_USER: pilot107_test
      POSTGRES_PASSWORD: pilot107-test-only
    ports:
      - "${PILOT107_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot107_test -d pilot107_control_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
