services:
  pilot-agentd:
    environment:
      PILOT107_PHASE_AWARE_BUILDER: "1"
    volumes:
      - ../../services/pilot-agentd/dist:/opt/pilot-agentd/dist:ro

  pilot107-api:
    environment:
      PILOT107_PHASE_AWARE_BUILDER: "1"
    volumes:
      - ../../src:/opt/pilot107/src:ro

  pilot107-worker:
    environment:
      PILOT107_PHASE_AWARE_BUILDER: "1"
    volumes:
      - ../../src:/opt/pilot107/src:ro

  pilot107-web:
    environment:
      PILOT107_PHASE_AWARE_BUILDER: "1"
    volumes:
      - ../../src:/opt/pilot107/src:ro
