ClusterName=pilot107-cpu-rc
SlurmctldHost=slurmctld
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d
SwitchType=switch/none
MpiDefault=none
# This VM's Docker/systemd cgroup namespace cannot host Slurm cgroup/v2
# scopes. Docker limits the single demo node; Slurm therefore uses its proven
# non-cgroup task launcher on this target.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2

SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations,qos,limits
JobAcctGatherType=jobacct_gather/none
JobAcctGatherFrequency=30
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# The VM demonstration group tracks the actual 8-vCPU/16-GiB host envelope.
# Linux reports roughly 15.6 GiB usable memory, so Slurm advertises 15 GiB after
# rounding and keeps a small kernel/host reserve. Control-plane services are
# lightweight and demo jobs stay within their explicit resource requests.
NodeName=anode16 CPUs=8 Sockets=1 CoresPerSocket=8 ThreadsPerCore=1 RealMemory=15360 State=UNKNOWN
PartitionName=CPU-RC Nodes=anode16 Default=YES MaxTime=04:00:00 State=UP AllowAccounts=competition AllowQos=qos_cpu_rc
