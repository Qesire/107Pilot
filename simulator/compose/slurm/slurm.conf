ClusterName=pilot107-sim
SlurmctldHost=slurmctld
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/d
SwitchType=switch/none
MpiDefault=none
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2

SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5

# Keep this aligned with config/platform_profiles/simulator-real107-behavior.yaml.
# Associations are part of the simulator behavior contract: users must only be
# able to submit through account/QOS combinations granted by the profile.
AccountingStorageEnforce=associations,qos,limits
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU,CR_CORE_DEFAULT_DIST_BLOCK
GresTypes=gpu
SchedulerType=sched/backfill
SchedulerParameters=enable_user_top
PriorityType=priority/multifactor
# Docker workers deliberately expose the real platform's logical node shape
# while running on smaller local hosts; avoid draining them on host-hardware
# comparison. This is simulator-only and does not represent a real107 setting.
SlurmdParameters=config_overrides

# Scaled 107-style simulator topology. Only anode16/anode17 are backed by
# live Docker slurmd containers; anode05 is a placeholder to keep RTX/CPU
# partitions visible for compatibility and failure-state tests.
NodeName=anode05 CPUs=128 Sockets=2 CoresPerSocket=32 ThreadsPerCore=2 RealMemory=512000 Gres=gpu:RTX5090:8 State=DOWN Reason="sim placeholder for RTX partitions"
NodeName=anode16 CPUs=128 Sockets=2 CoresPerSocket=32 ThreadsPerCore=2 RealMemory=1024000 Gres=gpu:A100:8 State=UNKNOWN
NodeName=anode17 CPUs=128 Sockets=2 CoresPerSocket=32 ThreadsPerCore=2 RealMemory=1024000 Gres=gpu:A100:8 State=UNKNOWN

PartitionName=CPU-6530 Nodes=anode05 Default=NO MaxTime=UNLIMITED State=UP AllowAccounts=students AllowQos=qos_cpu-6530
PartitionName=CPU-8358P Nodes=anode[16-17] Default=NO MaxTime=UNLIMITED State=UP AllowAccounts=students AllowQos=qos_cpu-8358p
PartitionName=GPU-RTX5090 Nodes=anode05 Default=NO MaxTime=UNLIMITED State=UP AllowAccounts=students AllowQos=qos_gpu-rtx5090
PartitionName=GPU-A100 Nodes=anode[16-17] Default=NO MaxTime=UNLIMITED State=UP AllowAccounts=students AllowQos=qos_gpu-a100
PartitionName=P107-RTX5090 Nodes=anode05 Default=NO MaxTime=UNLIMITED State=UP AllowAccounts=competition AllowQos=qos_p107-rtx5090
PartitionName=P107-A100 Nodes=anode[16-17] Default=NO MaxTime=UNLIMITED State=UP AllowAccounts=competition AllowQos=qos_p107-a100
PartitionName=Students Nodes=anode[16-17] Default=YES MaxTime=UNLIMITED DefMemPerCPU=4096 State=UP AllowAccounts=students AllowQos=qos_stu001,qos_stu_default,qos_stu_small,qos_stu_medium,qos_stu_medium_2gpu,qos_stu_large,qos_stu_long,qos_stu_cpu_long

# Legacy partition retained for older unit and smoke fixtures. Competition
# scripts should prefer Students/qos_stu_medium_2gpu.
PartitionName=debug Nodes=anode[16-17] Default=NO MaxTime=01:00:00 State=UP AllowAccounts=students,legacy AllowQos=normal
