# Optional production overlay for the owner-bound real 107 SSH backend.
#
# This overlay changes only the API/Worker transport.  The Web UI, Run state
# machine, Evidence read model, market and Agent pages remain identical to the
# simulator deployment.  Authentication is performed interactively with
# scripts/manage-real107-ssh.sh; no password, OTP, or key belongs in .env.
services:
  pilot107-api:
    environment:
      PILOT107_API_BACKEND: real107-ssh
      PILOT107_ALLOWED_ROOTS: ${PILOT107_SSH_OWNER_ROOTS:-}
      PILOT107_CODE_CONTEXT_TRANSPORT: ssh
      PILOT107_CODE_CONTEXT_ALLOWED_ROOTS: ${PILOT107_SSH_OWNER_ROOTS:-}
      PILOT107_CODE_CONTEXT_SSH_TARGET: ${PILOT107_SSH_TARGET:-}
      PILOT107_CODE_CONTEXT_SSH_CONTROL_PATH: ${PILOT107_SSH_CONTROL_PATH:-/var/lib/pilot107/ssh/real107.sock}
      PILOT107_CODE_CONTEXT_SSH_PORT: ${PILOT107_SSH_PORT:-22}

  pilot107-worker:
    environment:
      PILOT107_WORKER_BACKEND: real107-ssh
      PILOT107_ALLOWED_ROOTS: ${PILOT107_SSH_OWNER_ROOTS:-}
