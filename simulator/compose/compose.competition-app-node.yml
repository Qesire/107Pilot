name: pilot107-app-node

services:
  pilot-agentd:
    image: ${PILOT107_AGENTD_IMAGE:-pilot107/agentd:local}
    restart: unless-stopped
    user: "10701:10701"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    environment:
      PILOT107_AGENTD_LISTEN_HOST: 0.0.0.0
      PILOT107_AGENTD_LISTEN_PORT: 8091
      PILOT107_AGENTD_TOKEN: ${PILOT107_AGENTD_TOKEN:-competition-agentd-token}
      PILOT107_AGENTD_MODEL_PROFILE: ${PILOT107_AGENTD_MODEL_PROFILE:-campus-default}
      PILOT107_AGENTD_FAUX_SCENARIO: ${PILOT107_AGENTD_FAUX_SCENARIO:-}
      PILOT107_AGENTD_TOOL_GATEWAY_URL: http://pilot107-api:8080/internal/v1/agent-tools/invoke
      PILOT107_LLM_BASE_URL: ${PILOT107_LLM_BASE_URL:-}
      PILOT107_LLM_API_KEY: ${PILOT107_LLM_API_KEY:-}
      PILOT107_LLM_MODEL: ${PILOT107_LLM_MODEL:-}
      PILOT107_LLM_TIMEOUT_SECONDS: ${PILOT107_LLM_TIMEOUT_SECONDS:-60}
      PILOT107_LLM_MAX_TOKENS: ${PILOT107_LLM_MAX_TOKENS:-1200}
      PILOT107_LLM_MAX_ATTEMPTS: ${PILOT107_LLM_MAX_ATTEMPTS:-2}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8091/readyz')
          .then(response=>{if(!response.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-api:
    image: ${PILOT107_API_IMAGE:-pilot107/api:local}
    restart: unless-stopped
    user: "10700:10700"
    group_add:
      - "${PILOT107_SECRET_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=bwrap
      - systempaths=unconfined
    networks:
      - app
    command:
      - python3
      - -m
      - pilot107.api.dev_server
      - --db-path
      - /var/lib/pilot107/pilot107.db
      - --evidence-root
      - /var/lib/pilot107/evidence
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --auth-required
    ports:
      - "${PILOT107_API_PORT:-127.0.0.1:18080}:8080"
    environment:
      PILOT107_MODE: docker-sim
      PILOT107_API_BACKEND: command-gateway
      PILOT107_COMMAND_GATEWAY_URL: ${PILOT107_REMOTE_COMMAND_GATEWAY_URL:?set PILOT107_REMOTE_COMMAND_GATEWAY_URL}
      PILOT107_COMMAND_GATEWAY_TOKEN: ${PILOT107_COMMAND_GATEWAY_TOKEN:-competition-dev-token}
      PILOT107_TERMINAL_ENABLED: "true"
      PILOT107_ALLOWED_ROOTS: ${PILOT107_ALLOWED_ROOTS:-/public/home/{user}}
      PILOT107_DB_PATH: /var/lib/pilot107/pilot107.db
      PILOT107_POSTGRES_DSN: ${PILOT107_POSTGRES_DSN:-}
      PILOT107_EVIDENCE_ROOT: /var/lib/pilot107/evidence
      PILOT107_CAPSULE_ROOT: /var/lib/pilot107/capsules
      PILOT107_AUTH_REQUIRED: "true"
      PILOT107_PROXY_HMAC_SECRET_FILE: /run/secrets/pilot107-proxy-hmac
      PILOT107_AGENT_CAPABILITY_HMAC_SECRET_FILE: /run/secrets/pilot107-agent-capability-hmac
      PILOT107_CONTRACT_PROFILE: ${PILOT107_CONTRACT_PROFILE:-real107-sim}
      PILOT107_AGENTD_URL: http://pilot-agentd:8091
      PILOT107_AGENTD_TOKEN: ${PILOT107_AGENTD_TOKEN:-competition-agentd-token}
      PILOT107_AGENTD_MODEL_PROFILE: ${PILOT107_AGENTD_MODEL_PROFILE:-campus-default}
    volumes:
      - public:/public:ro
      - pilot107-data:/var/lib/pilot107
    secrets:
      - pilot107-proxy-hmac
      - pilot107-agent-capability-hmac
    depends_on:
      pilot-agentd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-worker:
    image: ${PILOT107_WORKER_IMAGE:-pilot107/worker:local}
    restart: unless-stopped
    user: "10700:10700"
    group_add:
      - "${PILOT107_SECRET_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    command: ["python3", "-m", "pilot107.worker.service"]
    environment:
      PILOT107_MODE: docker-sim
      PILOT107_DB_PATH: /var/lib/pilot107/pilot107.db
      PILOT107_POSTGRES_DSN: ${PILOT107_POSTGRES_DSN:-}
      PILOT107_EVIDENCE_ROOT: /var/lib/pilot107/evidence
      PILOT107_WORKER_BACKEND: command-gateway
      PILOT107_COMMAND_GATEWAY_URL: ${PILOT107_REMOTE_COMMAND_GATEWAY_URL:?set PILOT107_REMOTE_COMMAND_GATEWAY_URL}
      PILOT107_COMMAND_GATEWAY_TOKEN: ${PILOT107_COMMAND_GATEWAY_TOKEN:-competition-dev-token}
      PILOT107_ALLOWED_ROOTS: ${PILOT107_ALLOWED_ROOTS:-/public/home/{user}}
      PILOT107_WORKER_HEALTH_PATH: /var/lib/pilot107/worker-health.json
      PILOT107_AGENTD_URL: http://pilot-agentd:8091
      PILOT107_AGENTD_TOKEN: ${PILOT107_AGENTD_TOKEN:-competition-agentd-token}
      PILOT107_AGENTD_MODEL_PROFILE: ${PILOT107_AGENTD_MODEL_PROFILE:-campus-default}
      PILOT107_AGENT_CAPABILITY_HMAC_SECRET_FILE: /run/secrets/pilot107-agent-capability-hmac
    volumes:
      - public:/public:ro
      - pilot107-data:/var/lib/pilot107
    secrets:
      - pilot107-agent-capability-hmac
    depends_on:
      pilot107-api:
        condition: service_started
      pilot-agentd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import json,time;
          p=json.load(open('/var/lib/pilot107/worker-health.json'));
          assert p['ok'] is True;
          assert time.time()-p['last_tick_unix'] < 60"
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-web:
    image: ${PILOT107_WEB_IMAGE:-pilot107/web:local}
    restart: unless-stopped
    user: "10700:10700"
    group_add:
      - "${PILOT107_SECRET_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    command:
      - python3
      - -m
      - pilot107.web.server
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --api-base-url
      - http://pilot107-api:8080
    ports:
      - "${PILOT107_WEB_PORT:-127.0.0.1:13000}:3000"
    environment:
      PILOT107_WEB_API_BASE_URL: http://pilot107-api:8080
      PILOT107_WEB_DEMO_USER: ${PILOT107_WEB_DEMO_USER:-alice}
      PILOT107_WEB_IDENTITY_MODE: fixed_user
      PILOT107_WEB_FIXED_USER: ${PILOT107_WEB_FIXED_USER:-alice}
      PILOT107_WEB_PUBLIC_ORIGIN: ${PILOT107_WEB_PUBLIC_ORIGIN:-https://127.0.0.1:8443}
      PILOT107_WEB_ENABLE_HSTS: "true"
      PILOT107_PROXY_HMAC_SECRET_FILE: /run/secrets/pilot107-proxy-hmac
    secrets:
      - pilot107-proxy-hmac
    depends_on:
      - pilot107-api
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-reverse-proxy:
    image: ${PILOT107_REVERSE_PROXY_IMAGE:-pilot107/web:local}
    restart: unless-stopped
    user: "10700:10700"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    ports:
      - "${PILOT107_HTTP_PORT:-8088}:8080"
      - "${PILOT107_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    command:
      - python3
      - -m
      - pilot107.web.reverse_proxy
      - --host
      - 0.0.0.0
      - --http-port
      - "8080"
      - --https-port
      - "8443"
      - --target
      - http://pilot107-web:3000
      - --cert
      - /etc/nginx/certs/tls.crt
      - --key
      - /etc/nginx/certs/tls.key
      - --max-request-body-bytes
      - "16777216"
    depends_on:
      - pilot107-web
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport ssl, urllib.request\nctx = ssl._create_unverified_context()\nurllib.request.urlopen('https://127.0.0.1:8443/healthz', context=ctx, timeout=2).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  app:
    driver: bridge

volumes:
  public:
  pilot107-data:

secrets:
  pilot107-proxy-hmac:
    file: ${PILOT107_PROXY_HMAC_SECRET_FILE:-./secrets/proxy-hmac.local}
  pilot107-agent-capability-hmac:
    file: ${PILOT107_AGENT_CAPABILITY_HMAC_SECRET_FILE:-./secrets/agent-capability-hmac.local}
