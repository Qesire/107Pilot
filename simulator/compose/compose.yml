name: pilot107-sim

x-slurm-common: &slurm-common
  image: ${SLURM_SIM_IMAGE:-pilot107/slurm-sim:25.11-real107}
  restart: unless-stopped
  networks:
    - sim
  volumes:
    - public:/public
    - slurm-log:/var/log/slurm
    - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
    - ./slurm/gres.conf:/etc/slurm/gres.conf:ro
    - ./slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro
    - ./scripts/init-public.sh:/opt/pilot107/init-public.sh:ro

services:
  mariadb:
    image: ${SLURM_SIM_IMAGE:-pilot107/slurm-sim:25.11-real107}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-pilot107-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-slurm_acct_db}
      MARIADB_USER: ${MARIADB_USER:-slurm}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-pilot107-slurm}
    networks:
      - sim
    volumes:
      - mariadb-data:/var/lib/mysql
    command: ["pilot107-mariadb"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  slurmdbd:
    <<: *slurm-common
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["pilot107-slurmdbd"]
    volumes:
      - public:/public
      - slurm-log:/var/log/slurm
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./slurm/gres.conf:/etc/slurm/gres.conf:ro
      - ./slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro

  slurmctld:
    <<: *slurm-common
    depends_on:
      - slurmdbd
    hostname: slurmctld
    command: ["slurmctld", "-D", "-i", "-vvv"]

  slurmrestd:
    <<: *slurm-common
    depends_on:
      - slurmctld
    ports:
      - "${SLURMRESTD_PORT:-6820}:6820"
    cap_add:
      - SYS_ADMIN
    environment:
      SLURM_JWT: daemon
    command: ["gosu", "pilot107", "slurmrestd", "-a", "rest_auth/jwt", "0.0.0.0:6820"]

  login-node-sim:
    <<: *slurm-common
    depends_on:
      - slurmctld
    hostname: login-node-sim
    command: ["sleep", "infinity"]

  worker-1:
    <<: *slurm-common
    depends_on:
      - slurmctld
    hostname: anode16
    command: ["slurmd", "-D", "-vvv"]
    privileged: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - public:/public
      - slurm-log:/var/log/slurm
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./slurm/gres.conf:/etc/slurm/gres.conf:ro
      - ./slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro
      - ./scripts/init-public.sh:/opt/pilot107/init-public.sh:ro

  worker-2:
    <<: *slurm-common
    depends_on:
      - slurmctld
    hostname: anode17
    command: ["slurmd", "-D", "-vvv"]
    privileged: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - public:/public
      - slurm-log:/var/log/slurm
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./slurm/gres.conf:/etc/slurm/gres.conf:ro
      - ./slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro
      - ./scripts/init-public.sh:/opt/pilot107/init-public.sh:ro

  pilot107-command-gateway:
    image: ${SLURM_SIM_IMAGE:-pilot107/slurm-sim:25.11-real107}
    restart: unless-stopped
    profiles: ["apps"]
    networks:
      - sim
    environment:
      PILOT107_COMMAND_GATEWAY_TOKEN: ${PILOT107_COMMAND_GATEWAY_TOKEN:-sim-dev-token}
      # Formal real107-ssh relay settings. They are inert unless the backend is
      # explicitly switched to real107-ssh.
      PILOT107_SSH_CONNECTION_ID: ${PILOT107_SSH_CONNECTION_ID:-real107}
      PILOT107_SSH_TARGET_ID: ${PILOT107_SSH_TARGET_ID:-real107}
      PILOT107_SSH_TARGET: ${PILOT107_SSH_TARGET:-}
      PILOT107_SSH_CONTROL_PATH: ${PILOT107_SSH_CONTROL_PATH:-/var/lib/pilot107/ssh/real107.sock}
      PILOT107_SSH_KNOWN_HOSTS_FILE: ${PILOT107_SSH_KNOWN_HOSTS_FILE:-/var/lib/pilot107/ssh/known_hosts}
      PILOT107_SSH_PORT: ${PILOT107_SSH_PORT:-22}
      PILOT107_SSH_PORTAL_OWNER: ${PILOT107_SSH_PORTAL_OWNER:-}
      PILOT107_SSH_SLURM_USER: ${PILOT107_SSH_SLURM_USER:-}
      PILOT107_SSH_OWNER_ROOTS: ${PILOT107_SSH_OWNER_ROOTS:-}
      PILOT107_GATEWAY_ALLOWED_ROOTS: ${PILOT107_ALLOWED_ROOTS:-/public/home/{user}}
      PILOT107_GATEWAY_AUDIT_LOG: ${PILOT107_GATEWAY_AUDIT_LOG:-/var/log/slurm/pilot107-command-gateway-audit.jsonl}
      PILOT107_GATEWAY_RATE_LIMIT_MAX: ${PILOT107_GATEWAY_RATE_LIMIT_MAX:-1200}
      PILOT107_GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${PILOT107_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - public:/public
      - slurm-log:/var/log/slurm
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./slurm/gres.conf:/etc/slurm/gres.conf:ro
      - ./slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro
      - ./scripts/init-public.sh:/opt/pilot107/init-public.sh:ro
      - ./scripts/command-gateway.py:/opt/pilot107/command-gateway.py:ro
    command: ["python3", "/opt/pilot107/command-gateway.py", "--host", "0.0.0.0", "--port", "8090"]
    depends_on:
      - slurmctld
      - worker-1
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 10

  pilot-agentd:
    image: ${PILOT107_AGENTD_IMAGE:-pilot107/agentd:local}
    restart: unless-stopped
    profiles: ["apps"]
    user: "10701:10701"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sim
    environment:
      PILOT107_AGENTD_LISTEN_HOST: 0.0.0.0
      PILOT107_AGENTD_LISTEN_PORT: 8091
      PILOT107_AGENTD_TOKEN: ${PILOT107_AGENTD_TOKEN:-sim-agentd-token}
      PILOT107_AGENTD_MODEL_PROFILE: ${PILOT107_AGENTD_MODEL_PROFILE:-campus-default}
      PILOT107_AGENTD_FAUX_SCENARIO: ${PILOT107_AGENTD_FAUX_SCENARIO:-}
      PILOT107_AGENTD_TOOL_GATEWAY_URL: http://pilot107-api:8080/internal/v1/agent-tools/invoke
      PILOT107_LLM_BASE_URL: ${PILOT107_LLM_BASE_URL:-}
      PILOT107_LLM_API_KEY: ${PILOT107_LLM_API_KEY:-}
      PILOT107_LLM_MODEL: ${PILOT107_LLM_MODEL:-}
      PILOT107_LLM_TIMEOUT_SECONDS: ${PILOT107_LLM_TIMEOUT_SECONDS:-60}
      PILOT107_LLM_MAX_TOKENS: ${PILOT107_LLM_MAX_TOKENS:-1200}
      PILOT107_LLM_MAX_ATTEMPTS: ${PILOT107_LLM_MAX_ATTEMPTS:-2}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8091/readyz')
          .then(response=>{if(!response.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-api:
    image: ${PILOT107_API_IMAGE:-pilot107/api:local}
    restart: unless-stopped
    profiles: ["apps"]
    user: "10700:10700"
    group_add:
      - "${PILOT107_SECRET_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sim
    command:
      - python3
      - -m
      - pilot107.api.dev_server
      - --db-path
      - /var/lib/pilot107/pilot107.db
      - --evidence-root
      - /var/lib/pilot107/evidence
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --auth-required
    ports:
      - "${PILOT107_API_PORT:-8080}:8080"
    environment:
      PILOT107_MODE: docker-sim
      PILOT107_API_BACKEND: ${PILOT107_API_BACKEND:-demo}
      PILOT107_DB_PATH: /var/lib/pilot107/pilot107.db
      PILOT107_POSTGRES_DSN: ${PILOT107_POSTGRES_DSN:-}
      PILOT107_EVIDENCE_ROOT: /var/lib/pilot107/evidence
      PILOT107_CAPSULE_ROOT: /var/lib/pilot107/capsules
      PILOT107_WORKER_METRICS_ROOT: /var/lib/pilot107/worker-metrics
      # ``{user}`` is expanded by the service at submission time.  It keeps
      # demo users isolated instead of granting Alice access to Bob's home.
      PILOT107_ALLOWED_ROOTS: ${PILOT107_ALLOWED_ROOTS:-/public/home/{user}}
      PILOT107_AUTH_REQUIRED: "true"
      PILOT107_PROXY_HMAC_SECRET_FILE: /run/secrets/pilot107-proxy-hmac
      PILOT107_AGENT_CAPABILITY_HMAC_SECRET_FILE: /run/secrets/pilot107-agent-capability-hmac
      PILOT107_CONTRACT_PROFILE: ${PILOT107_CONTRACT_PROFILE:-real107-sim}
      PILOT107_CAPABILITY_PROFILE_PATH: ${PILOT107_CAPABILITY_PROFILE_PATH:-/opt/pilot107/config/platform_profiles/simulator-real107-behavior.yaml}
      PILOT107_SLURMRESTD_URL: http://slurmrestd:6820
      PILOT107_REST_AUTH_STYLE: ${PILOT107_REST_AUTH_STYLE:-bearer}
      PILOT107_SLURM_USER_NAME: ${PILOT107_SLURM_USER_NAME:-alice}
      PILOT107_SLURM_TOKEN: ${PILOT107_SLURM_TOKEN:-}
      PILOT107_AGENTD_URL: http://pilot-agentd:8091
      PILOT107_AGENTD_TOKEN: ${PILOT107_AGENTD_TOKEN:-sim-agentd-token}
      PILOT107_AGENTD_MODEL_PROFILE: ${PILOT107_AGENTD_MODEL_PROFILE:-campus-default}
      # Disabled by default.  When enabled, the API reads only source windows
      # selected from evidence through an existing user-authenticated SSH
      # ControlMaster; it never stores a password or MFA code.
      PILOT107_CODE_CONTEXT_TRANSPORT: ${PILOT107_CODE_CONTEXT_TRANSPORT:-none}
      PILOT107_CODE_CONTEXT_ALLOWED_ROOTS: ${PILOT107_CODE_CONTEXT_ALLOWED_ROOTS:-}
      PILOT107_CODE_CONTEXT_SSH_TARGET: ${PILOT107_CODE_CONTEXT_SSH_TARGET:-}
      PILOT107_CODE_CONTEXT_SSH_CONTROL_PATH: ${PILOT107_CODE_CONTEXT_SSH_CONTROL_PATH:-}
      PILOT107_CODE_CONTEXT_SSH_PORT: ${PILOT107_CODE_CONTEXT_SSH_PORT:-}
      PILOT107_CODE_CONTEXT_MAX_CHUNKS: ${PILOT107_CODE_CONTEXT_MAX_CHUNKS:-3}
      PILOT107_CODE_CONTEXT_BEFORE_LINES: ${PILOT107_CODE_CONTEXT_BEFORE_LINES:-60}
      PILOT107_CODE_CONTEXT_AFTER_LINES: ${PILOT107_CODE_CONTEXT_AFTER_LINES:-60}
      PILOT107_CODE_CONTEXT_MAX_FILE_BYTES: ${PILOT107_CODE_CONTEXT_MAX_FILE_BYTES:-65536}
      # Allow the local code-context transport to run git projections on
      # workspaces owned by other UIDs (e.g. alice's home).  Without this,
      # git refuses to operate on repos with "dubious ownership".
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      PILOT107_TERMINAL_ENABLED: "true"
      PILOT107_COMMAND_GATEWAY_URL: http://pilot107-command-gateway:8090
      PILOT107_COMMAND_GATEWAY_TOKEN: ${PILOT107_COMMAND_GATEWAY_TOKEN:-sim-dev-token}
      PILOT107_SSH_CONNECTION_ID: ${PILOT107_SSH_CONNECTION_ID:-real107}
      PILOT107_SSH_TARGET_ID: ${PILOT107_SSH_TARGET_ID:-real107}
      PILOT107_SSH_TARGET: ${PILOT107_SSH_TARGET:-}
      PILOT107_SSH_CONTROL_PATH: ${PILOT107_SSH_CONTROL_PATH:-/var/lib/pilot107/ssh/real107.sock}
      PILOT107_SSH_KNOWN_HOSTS_FILE: ${PILOT107_SSH_KNOWN_HOSTS_FILE:-/var/lib/pilot107/ssh/known_hosts}
      PILOT107_SSH_PORT: ${PILOT107_SSH_PORT:-22}
      PILOT107_SSH_PORTAL_OWNER: ${PILOT107_SSH_PORTAL_OWNER:-}
      PILOT107_SSH_SLURM_USER: ${PILOT107_SSH_SLURM_USER:-}
      PILOT107_SSH_OWNER_ROOTS: ${PILOT107_SSH_OWNER_ROOTS:-}
      PILOT107_TEMPLATE_REVIEWERS: ${PILOT107_TEMPLATE_REVIEWERS:-reviewer}
      PILOT107_TEMPLATE_VERIFICATION_ENVIRONMENT: ${PILOT107_TEMPLATE_VERIFICATION_ENVIRONMENT:-docker}
    volumes:
      - public:/public:ro
      - pilot107-data:/var/lib/pilot107
    secrets:
      - pilot107-proxy-hmac
      - pilot107-agent-capability-hmac
    depends_on:
      slurmrestd:
        condition: service_started
      pilot107-command-gateway:
        condition: service_started
      pilot-agentd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-worker:
    image: ${PILOT107_WORKER_IMAGE:-pilot107/worker:local}
    restart: unless-stopped
    profiles: ["apps"]
    user: "10700:10700"
    group_add:
      - "${PILOT107_SECRET_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sim
    command: ["python3", "-m", "pilot107.worker.service"]
    environment:
      PILOT107_MODE: docker-sim
      PILOT107_DB_PATH: /var/lib/pilot107/pilot107.db
      PILOT107_POSTGRES_DSN: ${PILOT107_POSTGRES_DSN:-}
      PILOT107_EVIDENCE_ROOT: /var/lib/pilot107/evidence
      PILOT107_WORKER_BACKEND: ${PILOT107_WORKER_BACKEND:-demo}
      PILOT107_ALLOWED_ROOTS: ${PILOT107_ALLOWED_ROOTS:-/public/home/{user}}
      PILOT107_CAPABILITY_PROFILE_PATH: ${PILOT107_CAPABILITY_PROFILE_PATH:-/opt/pilot107/config/platform_profiles/simulator-real107-behavior.yaml}
      # Code context must mirror the API settings: remediation planning runs in
      # the Worker and needs the same worktree access to emit repair tickets.
      PILOT107_CODE_CONTEXT_TRANSPORT: ${PILOT107_CODE_CONTEXT_TRANSPORT:-none}
      PILOT107_CODE_CONTEXT_ALLOWED_ROOTS: ${PILOT107_CODE_CONTEXT_ALLOWED_ROOTS:-}
      PILOT107_CODE_CONTEXT_SSH_TARGET: ${PILOT107_CODE_CONTEXT_SSH_TARGET:-}
      PILOT107_CODE_CONTEXT_SSH_CONTROL_PATH: ${PILOT107_CODE_CONTEXT_SSH_CONTROL_PATH:-}
      PILOT107_CODE_CONTEXT_SSH_PORT: ${PILOT107_CODE_CONTEXT_SSH_PORT:-}
      PILOT107_CODE_CONTEXT_MAX_CHUNKS: ${PILOT107_CODE_CONTEXT_MAX_CHUNKS:-3}
      PILOT107_CODE_CONTEXT_BEFORE_LINES: ${PILOT107_CODE_CONTEXT_BEFORE_LINES:-60}
      PILOT107_CODE_CONTEXT_AFTER_LINES: ${PILOT107_CODE_CONTEXT_AFTER_LINES:-60}
      PILOT107_CODE_CONTEXT_MAX_FILE_BYTES: ${PILOT107_CODE_CONTEXT_MAX_FILE_BYTES:-65536}
      # Mirror the API's git safe.directory allowance: the Worker re-explains the
      # source Run during remediation planning and runs git projections on
      # workspaces owned by other UIDs (e.g. alice's home). Without this, git
      # refuses with "dubious ownership" and the code context degrades to an
      # unavailable bundle (no source chunks on the repair ticket).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
      PILOT107_WORKER_ID: runtime-worker-primary
      PILOT107_WORKER_HEALTH_PATH: /var/lib/pilot107/worker-health.json
      PILOT107_WORKER_METRICS_ROOT: /var/lib/pilot107/worker-metrics
      PILOT107_CAPSULE_ROOT: /var/lib/pilot107/capsules
      PILOT107_SLURMRESTD_URL: http://slurmrestd:6820
      # Keep these identical to the API settings whenever command-gateway is
      # selected: the Worker owns reconciliation and Evidence collection for
      # jobs submitted by the API.
      PILOT107_COMMAND_GATEWAY_URL: http://pilot107-command-gateway:8090
      PILOT107_COMMAND_GATEWAY_TOKEN: ${PILOT107_COMMAND_GATEWAY_TOKEN:-sim-dev-token}
      PILOT107_REST_AUTH_STYLE: ${PILOT107_REST_AUTH_STYLE:-bearer}
      PILOT107_SLURM_USER_NAME: ${PILOT107_SLURM_USER_NAME:-alice}
      PILOT107_SLURM_TOKEN: ${PILOT107_SLURM_TOKEN:-}
      PILOT107_AGENTD_URL: http://pilot-agentd:8091
      PILOT107_AGENTD_TOKEN: ${PILOT107_AGENTD_TOKEN:-sim-agentd-token}
      PILOT107_AGENTD_MODEL_PROFILE: ${PILOT107_AGENTD_MODEL_PROFILE:-campus-default}
      PILOT107_AGENT_CAPABILITY_HMAC_SECRET_FILE: /run/secrets/pilot107-agent-capability-hmac
    volumes:
      - public:/public:ro
      - pilot107-data:/var/lib/pilot107
    secrets:
      - pilot107-agent-capability-hmac
    depends_on:
      slurmrestd:
        condition: service_started
      pilot107-command-gateway:
        condition: service_started
      pilot-agentd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import json,time;
          p=json.load(open('/var/lib/pilot107/worker-health.json'));
          assert p['ok'] is True;
          assert time.time()-p['last_tick_unix'] < 60;
          assert p['telemetry_error'] is None;
          assert p['cumulative_metrics']['active'];
          assert p['cumulative_metrics']['schema'] == 'pilot107.worker_metrics.v1'"
      interval: 10s
      timeout: 5s
      retries: 6

  pilot107-web:
    image: ${PILOT107_WEB_IMAGE:-pilot107/web:local}
    restart: unless-stopped
    profiles: ["apps"]
    user: "10700:10700"
    group_add:
      - "${PILOT107_SECRET_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - sim
    command:
      - python3
      - -m
      - pilot107.web.server
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --api-base-url
      - http://pilot107-api:8080
    ports:
      - "${PILOT107_WEB_PORT:-3000}:3000"
    environment:
      PILOT107_WEB_API_BASE_URL: http://pilot107-api:8080
      PILOT107_WEB_DEMO_USER: ${PILOT107_WEB_DEMO_USER:-alice}
      PILOT107_WEB_IDENTITY_MODE: ${PILOT107_WEB_IDENTITY_MODE:-demo}
      PILOT107_WEB_FIXED_USER: ${PILOT107_WEB_FIXED_USER:-}
      PILOT107_WEB_TERMINAL_DEEP_LINK: ${PILOT107_WEB_TERMINAL_DEEP_LINK:-}
      PILOT107_WEB_PUBLIC_ORIGIN: ${PILOT107_WEB_PUBLIC_ORIGIN:-}
      PILOT107_PROXY_HMAC_SECRET_FILE: /run/secrets/pilot107-proxy-hmac
    secrets:
      - pilot107-proxy-hmac
    depends_on:
      - pilot107-api
    healthcheck:
      test: ["CMD-SHELL", "python3 - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  sim:
    driver: bridge

volumes:
  mariadb-data:
  public:
  slurm-log:
  pilot107-data:

secrets:
  pilot107-proxy-hmac:
    file: ${PILOT107_PROXY_HMAC_SECRET_FILE:-./secrets/proxy-hmac.local}
  pilot107-agent-capability-hmac:
    file: ${PILOT107_AGENT_CAPABILITY_HMAC_SECRET_FILE:-./secrets/agent-capability-hmac.local}
