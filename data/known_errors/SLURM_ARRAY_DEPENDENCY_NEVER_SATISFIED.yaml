error_id: SLURM.ARRAY_DEPENDENCY_NEVER_SATISFIED
category: dag_recovery
severity: error
retryable: true
stage: runtime
title: "单个 Array Task 失败导致整条 afterok 链失效"
symptoms:
  - "dependencysneversatisfied"
  - "dependency_never_satisfied"
  - "regex:dependency.*never.*satisfied"
evidence_paths:
  - logs/stderr.tail.txt
  - logs/stderr.tail.json
  - slurm/job_detail.json
  - slurm/accounting.json
root_cause: "Slurm array 只要一个 task 失败，聚合作业状态即为 FAILED；afterok 后继不会运行，大量后继作业永久 PENDING。"
fix_template:
  type: structured_patch
  patch: {}
fix_guide:
  fix: "取消失效后继；删除失败 task 的不可信残片；只补缺失 task；为新 merge 和后继建立新的依赖链。"
  prevention: "每个阶段提供 missing-task scanner 和 RESUME 入口；不以 Slurm 聚合作业状态作为唯一真源。"
  automation: "根据 shard/COMPLETE 完整性自动生成 --array=<missing_ids>。"
