name: temp-ci-real-failures-patch

on:
  push:
    branches:
      - ci-real-failures-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'ci: repair current CI contracts'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-real-failures-v1
          fetch-depth: 0
      - name: Apply bounded CI and UI repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {found}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}: {pattern[:80]!r}")
              p.write_text(updated)

          replace_exact(
              ".github/workflows/ci.yml",
              '      - run: uv sync --locked --extra dev --extra api\n      - run: uv run ruff check src tests scripts',
              '      - name: Install sandbox runtime\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y bubblewrap\n          bwrap --version\n      - run: uv sync --locked --extra dev --extra api\n      - run: uv run ruff check src tests scripts',
          )

          replace_exact(
              "apps/web/src/pages.tsx",
              '              <div><dt>Snapshot</dt><dd><FactState status={platform.data?.freshness} /></dd></div>\n              <div><dt>Entitlement</dt><dd><FactState status={entitlement.data?.freshness} /></dd></div>',
              '              <div><dt>Snapshot</dt><dd><FactState status={platform.data?.freshness} /></dd></div>\n              <div><dt>采集状态</dt><dd><FactState status={platform.data?.collection_status} /></dd></div>\n              <div><dt>Entitlement</dt><dd><FactState status={entitlement.data?.freshness} /></dd></div>',
          )

          visual = "tests/ui/visual.spec.js"
          replace_exact(visual, 'page.getByRole("button", { name: "查看 run_alice_succeeded" })', 'page.getByText("run_alice_failed", { exact: true }).first()', 2)
          replace_exact(visual, 'page.getByRole("button", { name: "查看 run_bob_running" })', 'page.getByText("run_bob_running", { exact: true }).first()')
          replace_exact(visual, '搜索 Run ID、Job ID 或 workdir', '搜索运行 ID、Job ID 或工作目录')
          replace_exact(visual, 'page.getByRole("link", { name: /工作台/ })', 'page.locator(\'a[aria-label="工作台"]\').first()')
          replace_exact(visual, 'page.getByRole("heading", { name: "新建 Contract" })', 'page.getByRole("heading", { name: "实验工作区" })')
          replace_exact(visual, 'page.getByRole("alert")).toContainText("表单与未应用源码发生冲突")', 'page.getByRole("alert").filter({ hasText: "表单与未应用源码发生冲突" })).toContainText("表单与未应用源码发生冲突")')
          replace_exact(visual, 'page.getByLabel("事件 3")', 'page.getByLabel(/事件 3/)')
          replace_exact(
              visual,
              '      return json(route, { items });',
              '      return json(route, { items, page: { limit: Number(url.searchParams.get("limit") || 20), has_more: false, next_cursor: null } });',
          )

          regex_once(
              visual,
              r'    if \(url\.pathname === "/api/v1/platform/capabilities"\) \{.*?\n    \}\n    if \(url\.pathname === "/api/v1/platform/observation"\) \{',
              '''    if (url.pathname === "/api/v1/platform/capabilities") {
      if (options.capabilitiesForbidden) {
        return json(route, { error: { code: "FORBIDDEN", message: "scope denied" } }, 403);
      }
      return json(route, {
        profile_id: "visual-slurm",
        source_authority: "simulator",
        captured_at: "2026-07-16T02:08:00Z",
        freshness_seconds: 30,
        default_partition: "Students",
        default_qos: "normal",
        partitions: [
          { name: "Students", total_nodes: 2, gpu_types: [], allow_qos: ["normal"] },
          { name: "GPU", total_nodes: 1, gpu_types: ["A100"], allow_qos: ["normal", "gpu"] },
        ],
        qos: [
          { name: "normal", max_gpus: 0, source_authority: "simulator" },
          { name: "gpu", max_gpus: 1, source_authority: "simulator" },
        ],
        dynamic_facts: ["nodes", "jobs"],
        limitations: [],
      });
    }
    if (url.pathname === "/api/v1/platform/snapshots/latest") {
      const capturedAt = options.stalePlatform ? "2020-01-01T00:00:00Z" : "2026-07-16T02:08:00Z";
      return json(route, {
        snapshot_id: "platform_visual",
        scope: "login_node",
        source_type: "simulator",
        source_name: "visual-fixture",
        captured_at: capturedAt,
        freshness: options.stalePlatform ? "stale" : "fresh",
        collection_status: options.stalePlatform ? "degraded" : "succeeded",
        data_quality: options.stalePlatform ? "degraded" : "ok",
        snapshot: {
          snapshot_id: "platform_visual",
          scope: "login_node",
          captured_at: capturedAt,
          nodes: [
            { node_name: "node-a", partitions: ["Students"], state_normalized: "idle", cpus_total: 64, cpus_allocated: 16, memory_mb: 256000 },
            { node_name: "node-b", partitions: ["GPU"], state_normalized: "mixed", cpus_total: 64, cpus_allocated: 32, memory_mb: 256000 },
          ],
          squeue_jobs: [{ job_id: "12345", state_raw: "PENDING", pending_reason: "Resources", partition: "Students", name: "visual" }],
        },
      });
    }
    if (url.pathname === "/api/v1/platform/entitlements/latest") {
      const owner = request.headers()["x-pilot107-user"] || "alice";
      return json(route, {
        snapshot_id: `entitlement_${owner}`,
        captured_at: "2026-07-16T02:08:00Z",
        observed_at: "2026-07-16T02:08:00Z",
        freshness: "fresh",
        data_quality: "ok",
        default_account: owner === "bob" ? "acct_bob" : "acct_alice",
        associations: [{ account: owner === "bob" ? "acct_bob" : "acct_alice", partition: "Students", qos: ["normal"], default_qos: "normal" }],
      });
    }
    if (url.pathname === "/api/v1/platform/connections") {
      return json(route, { items: [] });
    }
    if (url.pathname === "/api/v1/observability/connections/default/platform/latest") {
      return json(route, { connection_id: "default", freshness: "fresh", measures: {} });
    }
    if (url.pathname === "/api/v1/platform/observation") {''',
          )

          replace_exact(visual, '    scheduler_job_id: "12345",', '    scheduler_job_id: "12345",\n    job_id: "12345",\n    job_name: "failed-visual",\n    collection_state: "succeeded",')
          replace_exact(visual, '    scheduler_job_id: "12344",', '    scheduler_job_id: "12344",\n    job_id: "12344",\n    job_name: "successful-visual",\n    collection_state: "succeeded",')
          replace_exact(visual, '    scheduler_job_id: "22344",', '    scheduler_job_id: "22344",\n    job_id: "22344",\n    job_name: "bob-running",\n    collection_state: "pending",')

          regex_once(
              visual,
              r'function unifiedMarketItemPayload\(\) \{.*?\n\}\n\nfunction templateMarketPayload',
              '''function unifiedMarketItemPayload() {
  return {
    kind: "curated_template",
    item_id: "curated_release_visual",
    title: "Verified Python CPU",
    description: "Verified on simulator",
    visibility: "public",
    scope_key: null,
    publisher: "alice",
    published_at: "2026-07-16T02:08:00Z",
    updated_at: "2026-07-16T02:08:00Z",
    tags: ["python", "cpu"],
    adoption: { available: true, reason: null },
    withdrawn_at: null,
    template: { template_id: "template_visual", release_version: "1.1.0", content_sha256: "c".repeat(64) },
    contract_payload: defaultStudioContract(),
    compatibility: { partitions: ["Students"], gpu: false },
    publication: { verification_environment: "docker" },
    metrics: { adoption_count: 2, verification_passed: 1, verification_failed: 0, verification_expired: 0, success_rate: 1, latest_verification: null },
  };
}

function templateMarketPayload''',
          )

          regex_once(
              visual,
              r'function marketApplicationPayload\(overrides = \{\}\) \{.*?\n\}\n\nfunction agentSessionPayload',
              '''function marketApplicationPayload(overrides = {}) {
  const completed = Boolean(overrides.completed);
  return {
    session_id: "market_application_visual",
    owner: "alice",
    request_key: "visual-market-application",
    source_kind: "curated_template",
    source_item_id: "curated_release_visual",
    source_digest: "e".repeat(64),
    assurance: "curated",
    user_intent: "将此市场条目安全地应用到我的私有实验工程",
    state: completed ? "completed" : "awaiting_confirmation",
    version: completed ? 2 : 1,
    project_id: "project_market_visual",
    workspace_id: "workspace_market_visual",
    change_set_id: "changeset_market_visual",
    target_contract_id: completed ? "contract_adopted_visual" : null,
    adoption_id: completed ? "adoption_visual" : null,
    target_contract_payload: defaultStudioContract(),
    plan_digest: "a".repeat(64),
    confirmation_digest: "b".repeat(64),
    change_set_digest: "c".repeat(64),
    created_at: "2026-07-16T02:08:00Z",
    updated_at: "2026-07-16T02:08:00Z",
  };
}

function agentSessionPayload''',
          )

          regex_once(
              visual,
              r'function agentSessionPayload\(\) \{.*?\n\}\n\nfunction agentEventPayloads\(\) \{.*?\n\}',
              '''function agentSessionPayload() {
  return {
    session_id: "agent_visual",
    owner: "alice",
    request_key: "visual-agent-session",
    profile_id: "hpc-readonly-v1",
    model_profile_id: "campus-default",
    source: {},
    state: "idle",
    state_version: 1,
    resource_usage: {},
    outcome: null,
    created_at: "2026-07-16T02:08:00Z",
    updated_at: "2026-07-16T02:08:00Z",
  };
}

function agentEventPayloads() {
  return [{
    event_id: 3,
    turn_id: "turn_visual",
    session_id: "agent_visual",
    sequence: 3,
    event_type: "message_delta",
    payload: { delta: "排队原因是 Students 分区当前资源不足。" },
    created_at: "2026-07-16T02:08:03Z",
  }];
}''',
          )

          replace_exact(
              visual,
              '    if (url.pathname === "/api/v1/agent/sessions") {',
              '''    if (url.pathname === "/api/v1/agent-sessions") {
      return json(route, { items: [agentSessionPayload()], page: { limit: 20, has_more: false, next_cursor: null } });
    }
    if (url.pathname === "/api/v1/agent-sessions/agent_visual") {
      return json(route, agentSessionPayload());
    }
    if (url.pathname === "/api/v1/agent-sessions/agent_visual/events") {
      return json(route, { session_id: "agent_visual", items: agentEventPayloads(), page: { limit: 100, has_more: false, next_after_event_id: null, last_event_id: 3 } });
    }
    if (url.pathname === "/api/v1/agent/sessions") {''',
          )
          PY

      - name: Commit materialized repair
        shell: bash
        run: |
          git config user.name "107Pilot CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/web/src/pages.tsx tests/ui/visual.spec.js
          git diff --cached --check
          git commit -m "ci: repair current CI contracts"
          git push origin HEAD:ci-real-failures-v1
