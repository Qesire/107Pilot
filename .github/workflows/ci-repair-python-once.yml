name: ci-repair-python-once

# Full candidate validation. Temporary workflow; remove before final CI.
on:
  push:
    branches:
      - fix/competition-postgres-only-ci

permissions:
  contents: read

jobs:
  repair:
    if: github.event.head_commit.message == 'ci-repair-python-validate-teststores'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/competition-postgres-only-ci
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Restore exact SQLite test durability candidate
        run: |
          set -euo pipefail
          base=62b62c3a53d78bf4a8ad5bf3b77b134849d1ea29
          git show "$base:src/pilot107/agent/workspace_live.py" > src/pilot107/agent/workspace_live.py
          git show "$base:src/pilot107/agent/workspace_journal.py" > src/pilot107/agent/workspace_journal.py
          python - <<'PY'
          from pathlib import Path
          import re

          live_path = Path("src/pilot107/agent/workspace_live.py")
          text = live_path.read_text(encoding="utf-8")
          text = re.sub(
              r'\A""".*?"""',
              '"""Workspace live-head domain types and explicit SQLite test durability.\n\n'
              'Production composition is PostgreSQL-only. The SQLite implementation is retained\n'
              'solely for explicitly injected development/test Project stores and is never selected\n'
              'by the production live-store factory.\n"""',
              text,
              count=1,
              flags=re.S,
          )
          pattern = re.compile(
              r"def build_workspace_live_store\(.*?\n\n\nclass SQLiteWorkspaceLiveStore:",
              re.S,
          )
          replacement = '''def build_workspace_live_store(
              project_store: object,
              *,
              clock: Callable[[], datetime] | None = None,
          ) -> WorkspaceLiveStore:
              """Build the PostgreSQL live-head authority or fail closed."""

              dsn = getattr(project_store, "dsn", None)
              if not isinstance(dsn, str) or not dsn:
                  raise RuntimeError(
                      "Workspace live-head authority requires PostgreSQL; "
                      "SQLite Workspace live authority has been retired from runtime composition"
                  )
              from pilot107.agent.postgres_workspace_durability import PostgresWorkspaceLiveStore

              return PostgresWorkspaceLiveStore(dsn, clock=clock)


          class SQLiteWorkspaceLiveStore:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"workspace_live factory replacement count={count}")
          text = text.replace("from typing import Protocol", "from typing import Any, Protocol", 1)
          text = text.replace("Mapping[str, object]", "Mapping[str, Any]", 1)
          long_raise = (
              '                raise WorkspaceLiveConflict('
              '"Workspace live manifest contains unsupported file type")'
          )
          wrapped_raise = (
              '                raise WorkspaceLiveConflict(\n'
              '                    "Workspace live manifest contains unsupported file type"\n'
              '                )'
          )
          if text.count(long_raise) != 1:
              raise SystemExit("workspace_live long raise count mismatch")
          text = text.replace(long_raise, wrapped_raise, 1)
          live_path.write_text(text, encoding="utf-8")

          journal_path = Path("src/pilot107/agent/workspace_journal.py")
          journal = journal_path.read_text(encoding="utf-8")
          journal = re.sub(
              r'\A""".*?"""',
              '"""Workspace mutation journal records and explicit SQLite test durability.\n\n'
              'PostgreSQL is the production journal authority. The SQLite implementation remains\n'
              'available only to explicitly injected development/test Workspace editors.\n"""',
              journal,
              count=1,
              flags=re.S,
          )
          journal = journal.replace("from typing import Literal", "from typing import Any, Literal", 1)
          if journal.count("Mapping[str, object]") != 2:
              raise SystemExit("workspace_journal row mapping count mismatch")
          journal = journal.replace("Mapping[str, object]", "Mapping[str, Any]")
          journal_path.write_text(journal, encoding="utf-8")
          PY
      - name: Prepare explicit test-store candidate
        run: python scripts/ci_repair_python_teststores.py
      - name: Apply durable replay candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pilot107/worker/agent_turn_worker.py")
          text = path.read_text(encoding="utf-8")
          old = "        event_sequence_base = current.event_sequence\n"
          new = (
              "        event_sequence_base = (\n"
              "            current.event_sequence if current.final_checkpoint is not None else 0\n"
              "        )\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one replay base site, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Sync validation environment
        run: uv sync --locked --extra dev --extra api --extra postgres
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: mypy
        run: uv run mypy src
      - name: Contract and composition targets
        run: |
          uv run pytest -q \
            tests/test_lifecycle_store_selection.py \
            tests/test_postgres_only_runtime_authority.py \
            tests/agent/test_tool_gateway.py \
            tests/test_agent_tool_gateway_api.py \
            tests/test_api_service.py \
            tests/test_worker_service.py \
            tests/api/test_service_snapshot_wiring.py \
            tests/api/test_service_template_seed_wiring.py \
            tests/test_agent_turn_worker.py
      - name: Sandbox tests
        run: uv run pytest -q tests/agent/test_workspace_sandbox.py
      - name: Direct sandbox diagnostic
        run: |
          PYTHONPATH=src uv run python - <<'PY'
          from pathlib import Path
          import tempfile

          from pilot107.agent.sandbox import SandboxExecutor
          from pilot107.agent.workspace import AgentWorkspaceRecord, WorkspaceSnapshot

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary) / "workspace"
              root.mkdir()
              (root / "main.py").write_text("print('ok')\n", encoding="utf-8")
              workspace = AgentWorkspaceRecord(
                  workspace_id="workspace-sandbox-diag",
                  project_id="project-sandbox-diag",
                  owner="alice",
                  local_root=str(root),
                  snapshot=WorkspaceSnapshot(
                      source_ref="/public/home/alice/project",
                      digest="b" * 64,
                      entries=(),
                      captured_at="2026-08-19T00:00:00Z",
                  ),
                  created_at="2026-08-19T00:00:00Z",
                  updated_at="2026-08-19T00:00:00Z",
              )
              sandbox = SandboxExecutor()
              argv = ("python", "-m", "py_compile", "main.py")
              result = sandbox.execute(workspace, argv=argv, timeout=3)
              print("SANDBOX_STATUS", result.status)
              print("SANDBOX_EXIT", result.exit_code)
              print("SANDBOX_LIMIT", result.limit_reason)
              print("SANDBOX_STDOUT", repr(result.stdout))
              print("SANDBOX_STDERR", repr(result.stderr))
              print("SANDBOX_COMMAND", sandbox._sandbox_command(root.resolve(), argv))
              assert result.status == "succeeded", result
          PY
      - name: Lifecycle acceptance
        run: uv run pytest tests/test_agent_lifecycle_acceptance.py -q
      - name: Full pytest
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/pytest.log
      - name: Capture candidate diff
        if: always()
        run: git diff -- src tests > /tmp/candidate.patch
      - name: Upload pytest diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic
          path: /tmp/pytest.log
          if-no-files-found: ignore
      - name: Upload validated candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-teststore-candidate
          path: |
            /tmp/candidate.patch
            src/pilot107/agent/workspace_live.py
            src/pilot107/agent/workspace_journal.py
            src/pilot107/agent/operation_ledger.py
            src/pilot107/agent/operation_attempts.py
            src/pilot107/agent/operation_reconciler.py
            src/pilot107/worker/agent_turn_worker.py
            tests/conftest.py
            tests/agent/test_postgres_store.py
            tests/agent/test_project_store_contract.py
            tests/agent/test_task_store_contract.py
            tests/test_control_repository.py
            tests/api/test_service_snapshot_wiring.py
            tests/api/test_service_template_seed_wiring.py
