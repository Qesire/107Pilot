name: ci-autofix-once

on:
  push:
    branches:
      - fix/competition-postgres-only-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci-autofix-lint'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/competition-postgres-only-ci
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Apply mechanical Ruff repairs
        run: |
          set -euo pipefail
          files="src/pilot107/agent/durable_workspace.py src/pilot107/agent/durable_workspace_atomic.py"
          uv run ruff check --fix --unsafe-fixes $files || true
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pilot107/agent/durable_workspace.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '            after_digest = None if patch.operation == "delete" else hashlib.sha256(after).hexdigest()\n':
              '            after_digest = (\n'
              '                None if patch.operation == "delete" else hashlib.sha256(after).hexdigest()\n'
              '            )\n',
              '                raise WorkspaceLiveConflict("Workspace live manifest contains unsupported file type")\n':
              '                raise WorkspaceLiveConflict(\n'
              '                    "Workspace live manifest contains unsupported file type"\n'
              '                )\n',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"expected one exact long-line match, got {text.count(before)}")
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format $files
          uv run ruff check $files
          git diff --check
      - name: Commit lint repairs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pilot107/agent/durable_workspace.py src/pilot107/agent/durable_workspace_atomic.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): normalize restored AC4 test implementation"
          git push origin HEAD:fix/competition-postgres-only-ci
