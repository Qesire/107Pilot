name: ci-autofix-once

on:
  push:
    branches:
      - fix/competition-postgres-only-ci

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci-autofix-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/competition-postgres-only-ci
          fetch-depth: 0
      - name: Apply exact CI repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ledger_path = Path("src/pilot107/agent/operation_ledger.py")
          ledger = ledger_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"for value, label in \(\n"
              r"(?P<body>\s+\(self\.target_ref, \"target_ref\"\),\n"
              r"\s+\(self\.target_revision, \"target_revision\"\),\n"
              r"\s+\):\n"
              r"\s+if value is not None:\n"
              r"\s+_nonempty\(value, label\))"
          )
          matches = list(pattern.finditer(ledger))
          if len(matches) != 1:
              raise SystemExit(f"operation ledger target loop matches={len(matches)}")
          block = matches[0].group(0)
          repaired = (
              block.replace("for value, label", "for optional_value, label", 1)
              .replace("if value is not None", "if optional_value is not None", 1)
              .replace("_nonempty(value, label)", "_nonempty(optional_value, label)", 1)
          )
          ledger_path.write_text(ledger[:matches[0].start()] + repaired + ledger[matches[0].end():], encoding="utf-8")

          lock_path = Path("package-lock.json")
          lock = lock_path.read_text(encoding="utf-8")
          before = '"version": "3.1.3",\n      "resolved": "https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.3.tgz",\n      "integrity": "sha512-i70LwGWUduXqzicKXWshooq+sWL1K3WUU5rKZNG/0i3a1OSoX3HqhH5WbWwTmqWfor4urUakGPiRQcleRZTwOg=="'
          after = '"version": "3.1.7",\n      "resolved": "https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.7.tgz",\n      "integrity": "sha512-dOvZVzjdZdz7phd9v6jCbwxrBW3fK6n8Rc0CtdmM4bumzMnxywBYhuph6J819RRw/ku+rLbelwfMunktuzVVHg=="'
          if lock.count(before) != 1:
              raise SystemExit("fast-uri lock entry did not match exactly once")
          lock_path.write_text(lock.replace(before, after, 1), encoding="utf-8")
          PY
      - name: Verify lockfile and dependency audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit exact repairs
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pilot107/agent/operation_ledger.py package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): resolve typed ledger and fast-uri audit"
          git push origin HEAD:fix/competition-postgres-only-ci
