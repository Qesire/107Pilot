name: temp-file-pagination-verify

on:
  push:
    branches: [ux-v2-foundation]
    paths:
      - .github/workflows/_temp_file_pagination_verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra api
      - name: Targeted file backend tests
        run: uv run pytest -q tests/test_file_ops_executor.py tests/test_command_gateway.py tests/test_http_api.py
