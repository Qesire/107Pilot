name: ux-v2-transfer-manager-sync

on:
  push:
    branches:
      - ux-v2-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Integrate global transfer manager into app shell
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("apps/web/src/App.tsx")
          text = app.read_text()
          old = 'import { EnvBoundaryBanner } from "./EnvBoundaryBanner";\n'
          new = old + 'import { GlobalTransferIndicator } from "./GlobalTransferIndicator";\nimport { TransferManagerProvider } from "./TransferManager";\n'
          if 'import { GlobalTransferIndicator }' not in text:
              if old not in text:
                  raise SystemExit("App import marker not found")
              text = text.replace(old, new, 1)

          old = '''  return (\n    <div className="product-shell">'''
          new = '''  return (\n    <TransferManagerProvider key={user} user={user}>\n      <div className="product-shell">'''
          if '<TransferManagerProvider key={user}' not in text:
              if old not in text:
                  raise SystemExit("App provider opening marker not found")
              text = text.replace(old, new, 1)

          old = '''            <ConnectionBadge user={user} />\n            <StatusBadge'''
          new = '''            <ConnectionBadge user={user} />\n            <GlobalTransferIndicator user={user} onOpen={() => go("/files")} />\n            <StatusBadge'''
          if '<GlobalTransferIndicator user={user}' not in text:
              if old not in text:
                  raise SystemExit("App topbar marker not found")
              text = text.replace(old, new, 1)

          old = '''      </div>\n    </div>\n  );\n}\n\nfunction isKnownPath'''
          new = '''      </div>\n    </div>\n    </TransferManagerProvider>\n  );\n}\n\nfunction isKnownPath'''
          if '</TransferManagerProvider>' not in text:
              if old not in text:
                  raise SystemExit("App provider closing marker not found")
              text = text.replace(old, new, 1)
          app.write_text(text)

          main = Path("apps/web/src/main.tsx")
          text = main.read_text()
          marker = 'import "./styles/file-workspace-v2.css";\n'
          addition = marker + 'import "./styles/task-indicator-v2.css";\n'
          if 'task-indicator-v2.css' not in text:
              if marker not in text:
                  raise SystemExit("main style marker not found")
              text = text.replace(marker, addition, 1)
          main.write_text(text)

          manager = Path("apps/web/src/TransferManager.tsx")
          text = manager.read_text()
          old = '''  useEffect(() => () => {\n    mountedRef.current = false;\n  }, []);'''
          new = '''  useEffect(() => {\n    mountedRef.current = true;\n    return () => {\n      mountedRef.current = false;\n      for (const upload of uploadRefs.current.values()) void upload.abort().catch(() => undefined);\n    };\n  }, []);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'for (const upload of uploadRefs.current.values())' not in text:
              raise SystemExit("TransferManager cleanup marker not found")

          old = '''      const tus = await import("tus-js-client");\n      const upload = new tus.Upload(file, {'''
          new = '''      const tus = await import("tus-js-client");\n      // The task may have been cancelled while the lazy module was loading.\n      if (!fileRefs.current.has(task.id)) return;\n      const upload = new tus.Upload(file, {'''
          if 'task may have been cancelled while the lazy module was loading' not in text:
              if old not in text:
                  raise SystemExit("TransferManager dynamic import marker not found")
              text = text.replace(old, new, 1)
          manager.write_text(text)
          PY
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit app integration and generated static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/main.tsx apps/web/src/TransferManager.tsx src/pilot107/web/static
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git commit -m "build(web): integrate global transfer manager and sync bundle"
          git push origin HEAD:ux-v2-foundation
