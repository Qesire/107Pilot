name: temp-ac1b-operation-recovery

on:
  push:
    branches:
      - agentcore-ac1-operation-ledger
    paths:
      - scripts/_temp_ac1b_patch.py
      - .github/workflows/_temp_ac1b_patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agentcore-ac1-operation-ledger
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply AC1-B patch
        run: python scripts/_temp_ac1b_patch.py
      - name: Install targeted test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile Agent recovery sources
        run: >-
          python -m compileall -q
          src/pilot107/agent/operation_ledger.py
          src/pilot107/agent/operation_reconciler.py
          src/pilot107/agent/tool_gateway.py
      - name: Ruff targeted recovery files
        run: >-
          ruff check
          src/pilot107/agent/operation_reconciler.py
          src/pilot107/agent/tool_gateway.py
          tests/agent/test_operation_ledger.py
          tests/agent/test_operation_reconciler.py
      - name: Pytest targeted operation recovery
        run: >-
          pytest -q
          tests/agent/test_operation_ledger.py
          tests/agent/test_operation_reconciler.py
          tests/agent/test_tool_gateway.py
      - name: Remove temporary implementation assets
        if: success()
        run: rm -f scripts/_temp_ac1b_patch.py .github/workflows/_temp_ac1b_patch.yml
      - name: Commit validated AC1-B files
        if: success()
        shell: bash
        run: |
          git config user.name '107Pilot AC1 Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pilot107/agent/tool_gateway.py src/pilot107/agent/operation_reconciler.py tests/agent/test_operation_reconciler.py scripts/_temp_ac1b_patch.py .github/workflows/_temp_ac1b_patch.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat(agent): reconcile durable mutation receipts'
            git push origin HEAD:agentcore-ac1-operation-ledger
          fi
