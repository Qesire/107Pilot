name: temp-assets-a6-validation

on:
  push:
    branches:
      - ux-v2-assets-a6-validation
    paths:
      - scripts/_temp_apply_assets_a6.py
      - .github/workflows/_temp_assets_a6_validation.yml

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-assets-a6-validation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply staged A6 asset-reference migration
        run: python scripts/_temp_apply_assets_a6.py

      - name: Install web dependencies
        run: npm ci

      - name: Web static gates
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Files workspace regression gate
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/ui/files.spec.js

      - name: Contract asset reference workflow gate
        run: npx playwright test tests/ui/visual.spec.js --grep "workdir picker|shared_path"

      - name: Verify materialized diff
        run: |
          test -f apps/web/src/ContractAssetSummary.tsx
          test -f apps/web/src/ContractAssetSummary.test.ts
          test -f apps/web/src/styles/contract-assets-v2.css
          git diff --check
          git status --short

      - name: Commit validated A6 asset references
        run: |
          git config user.name "107Pilot validation bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/ContractAssetSummary.tsx \
            apps/web/src/ContractAssetSummary.test.ts \
            apps/web/src/styles/contract-assets-v2.css \
            apps/web/src/StudioPage.tsx \
            tests/ui/visual.spec.js \
            src/pilot107/web/static
          git commit -m "feat(studio): surface canonical experiment asset references"
          git push origin HEAD:ux-v2-assets-a6-validation
