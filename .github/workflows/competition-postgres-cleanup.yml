name: Competition PostgreSQL Cleanup

on:
  push:
    branches:
      - fix/competition-postgres-only-ci

permissions:
  contents: write

jobs:
  rebuild-clean-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository tooling
        run: uv sync --locked --extra dev --extra api

      - name: Restore source tree before broad formatter pass
        run: git checkout 4936754d2830a20ab2cc262681e763b40dc681aa -- src tests scripts

      - name: Apply frozen PostgreSQL-only authority retirement
        run: python scripts/retire-sqlite-runtime-authority.py

      - name: Remove one-shot machinery
        run: |
          rm scripts/retire-sqlite-runtime-authority.py
          rm .github/workflows/competition-postgres-cleanup.yml

      - name: Repair only touched and previously failing lint surfaces
        run: |
          FILES=(
            src/pilot107/api/service.py
            src/pilot107/worker/service.py
            src/pilot107/api/http_app.py
            tests/test_postgres_only_runtime_authority.py
            src/pilot107/agent/checkpoint_repair.py
            src/pilot107/agent/durable_workspace.py
            src/pilot107/agent/durable_workspace_atomic.py
            src/pilot107/agent/operation_attempts.py
            src/pilot107/agent/operation_ledger.py
            src/pilot107/agent/operation_reconciler.py
            src/pilot107/agent/postgres_workspace_atomic.py
            src/pilot107/agent/tool_gateway.py
            src/pilot107/agent/workspace_editor_factory.py
            src/pilot107/agent/workspace_live.py
            src/pilot107/core/workarea.py
            tests/test_lifecycle_store_selection.py
          )
          uv run ruff format "${FILES[@]}"
          uv run ruff check "${FILES[@]}" --fix --unsafe-fixes || true
          git diff --check

      - name: Commit clean scoped repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): scope PostgreSQL-only closure and repair lint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
