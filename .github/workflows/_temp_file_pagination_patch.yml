name: temp-file-pagination-patch

on:
  push:
    branches: [ux-v2-foundation]
    paths:
      - scripts/_temp_patch_file_pagination.py
      - .github/workflows/_temp_file_pagination_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_temp_patch_file_pagination.py
      - name: Compile changed Python
        run: python -m py_compile src/pilot107/adapters/slurm.py src/pilot107/api/file_routes.py simulator/compose/scripts/command-gateway.py tests/test_file_ops_executor.py
      - name: Commit patch
        run: |
          git config user.name "107Pilot UX bot"
          git config user.email "107pilot-ux-bot@users.noreply.github.com"
          git add src/pilot107/adapters/slurm.py src/pilot107/api/file_routes.py simulator/compose/scripts/command-gateway.py tests/test_file_ops_executor.py
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "feat(files): add bounded directory pagination"
          git push origin HEAD:ux-v2-foundation
