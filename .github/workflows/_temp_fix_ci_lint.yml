name: temp-fix-ci-lint

on:
  push:
    branches: [ux-v2-foundation]
    paths:
      - scripts/_temp_fix_ci_lint.py
      - .github/workflows/_temp_fix_ci_lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra api
      - name: Scope route patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_temp_fix_ci_lint.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if text.count(old) != 1:\n        raise RuntimeError(f"expected one list response use: {old}")\n    text = text.replace(old, new, 1)\n'''
          new = '''    expected = 2 if old == '\"next_cursor\": page.next_cursor' else 1\n    if text.count(old) != expected:\n        raise RuntimeError(\n            f"expected {expected} list response use(s): {old}; got {text.count(old)}"\n        )\n    text = text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"patch helper shape changed: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply contract closure
        run: python scripts/_temp_fix_ci_lint.py
      - name: Verify Ruff
        run: uv run ruff check src tests scripts --exclude scripts/_temp_fix_ci_lint.py
      - name: Verify mypy
        run: uv run mypy src
      - name: Verify file/backend tests
        run: >-
          uv run pytest -q
          tests/test_file_ops_executor.py
          tests/test_command_gateway.py
          tests/test_http_api.py
          tests/test_ssh_relay.py
          tests/agent/test_workspace_snapshot.py
      - name: Commit closure
        run: |
          git config user.name "107Pilot UX bot"
          git config user.email "107pilot-ux-bot@users.noreply.github.com"
          git add \
            src/pilot107/adapters/slurm.py \
            src/pilot107/adapters/ssh_relay.py \
            src/pilot107/api/file_routes.py \
            src/pilot107/api/service.py \
            src/pilot107/api/agent_tool_routes.py \
            src/pilot107/core/run_service.py \
            tests/test_ssh_relay.py
          git diff --cached --check
          git commit -m "fix(files): close paged backend contracts"
          git push origin HEAD:ux-v2-foundation
