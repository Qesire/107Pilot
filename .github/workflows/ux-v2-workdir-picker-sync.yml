name: ux-v2-workdir-picker-sync

on:
  push:
    branches:
      - ux-v2-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python scripts/ux_v2_patch_studio_picker.py
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit Studio picker and generated static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/StudioPage.tsx apps/web/src/main.tsx tests/ui/visual.spec.js src/pilot107/web/static
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git commit -m "build(web): connect Studio workdir picker and sync bundle"
          git push origin HEAD:ux-v2-foundation
