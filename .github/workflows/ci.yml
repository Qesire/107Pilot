name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Full CI is intentionally limited to main and pull requests. Agent/work branches
# can contain many small commits; running all five jobs for every intermediate
# push wastes private-repository hosted-runner minutes without adding a new
# integration boundary. A newer run supersedes an older run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync --locked --extra dev --extra api --extra postgres
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - name: Validate agent lifecycle acceptance manifests and fail-closed reports
        run: uv run pytest tests/test_agent_lifecycle_acceptance.py -q
      - name: Run Python test suite
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/pytest.log
      - name: Upload Python failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-failure-log
          path: /tmp/pytest.log
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Detect web static build drift
        run: |
          if ! git diff --exit-code -- src/pilot107/web/static | tee /tmp/web-static-drift.diff; then
            echo "::error::src/pilot107/web/static is stale. Run 'npm run build' locally and commit the updated bundle."
            git diff --stat -- src/pilot107/web/static | tee -a /tmp/web-static-drift.diff
            exit 1
          fi
      - name: Upload web static drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-static-drift
          path: /tmp/web-static-drift.diff
          if-no-files-found: ignore

  # Playwright UI suite (mocked API). Blocking gate covers the browser-level
  # Workbench → WorkArea/Launch → Run/Evidence flows that unit tests cannot reach.
  web-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright UI suite
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee /tmp/playwright.log
      - name: Upload visual review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: artifacts/visual-regression
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            /tmp/playwright.log
            playwright-report
            test-results
            artifacts/playwright-output
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh simulator/compose/scripts/check-compose-config.sh

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --extra dev
      - run: npm ci
      - name: Scan tracked secrets
        run: |
          set -o pipefail
          uv run python scripts/scan-tracked-secrets.py 2>&1 | tee /tmp/secret-scan.log
      - name: Upload secret-scan failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-failure-log
          path: /tmp/secret-scan.log
          if-no-files-found: ignore
      - name: Upgrade pip used by dependency audit
        run: uv pip install --upgrade "pip>=26.2"
      - run: uv run pip-audit --progress-spinner off
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -f apps/Dockerfile -t pilot107/app-ci:${{ github.sha }} .
      - name: Scan source, dependency locks, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pilot107/app-ci:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
