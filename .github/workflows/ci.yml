name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --extra api
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Detect web static build drift
        run: |
          if ! git diff --exit-code -- src/pilot107/web/static; then
            echo "::error::src/pilot107/web/static is stale. Run 'npm run build' locally and commit the updated bundle."
            git diff --stat -- src/pilot107/web/static
            exit 1
          fi

  # Playwright UI suite (mocked API). Blocking gate: tests/ui/visual.spec.js
  # is stabilized (14/14 passing). Covers Market→Adopt→Studio→Preflight→Run→
  # Evidence browser flows that unit tests cannot reach.
  web-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh simulator/compose/scripts/check-compose-config.sh

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --extra dev
      - run: npm ci
      - run: uv run python scripts/scan-tracked-secrets.py
      - run: uv run pip-audit --progress-spinner off
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -f apps/Dockerfile -t pilot107/app-ci:${{ github.sha }} .
      - name: Scan source, dependency locks, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pilot107/app-ci:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
