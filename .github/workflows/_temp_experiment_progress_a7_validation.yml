name: temp-experiment-progress-a7-validation

on:
  push:
    branches:
      - ux-v2-experiment-progress-a7-validation
    paths:
      - scripts/_temp_apply_experiment_progress_a7.py
      - .github/workflows/_temp_experiment_progress_a7_validation.yml

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-experiment-progress-a7-validation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply staged A7 experiment progress migration
        run: python scripts/_temp_apply_experiment_progress_a7.py

      - name: Install web dependencies
        run: npm ci

      - name: Web static gates
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Files workspace regression gate
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/ui/files.spec.js

      - name: Experiment shell lifecycle gate
        run: npx playwright test tests/ui/visual.spec.js --grep "experiment shell"

      - name: Verify materialized diff
        run: |
          grep -q 'ContractLaunchProgress' apps/web/src/ExperimentShell.tsx
          grep -q 'onProgressChange' apps/web/src/StudioPage.tsx
          grep -q 'experiment-config-editor' apps/web/src/StudioPage.tsx
          git diff --check
          git status --short

      - name: Commit validated A7 experiment progress
        run: |
          git config user.name "107Pilot validation bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/ExperimentShell.tsx \
            apps/web/src/ExperimentShell.test.tsx \
            apps/web/src/StudioPage.tsx \
            tests/ui/visual.spec.js \
            src/pilot107/web/static
          git commit -m "feat(experiments): bind launch progress into lifecycle shell"
          git push origin HEAD:ux-v2-experiment-progress-a7-validation
