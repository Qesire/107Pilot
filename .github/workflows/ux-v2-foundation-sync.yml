name: ux-v2-foundation-sync

on:
  push:
    branches:
      - ux-v2-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Refresh workbench UI contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/ui/visual.spec.js")
          text = path.read_text()
          old = '''test("workspace renders live run and platform read models", async ({ page }) => {
            await page.goto("/projects?user=alice");

            await expect(page.getByRole("heading", { name: "把下一次提交建立在可验证事实之上" })).toBeVisible();
            await expect(page.getByRole("button", { name: "查看 run_alice_succeeded" })).toBeVisible();
            await expect(page.getByText("acct_alice", { exact: true }).first()).toBeVisible();
            await expect(page.getByText("可见分区", { exact: true })).toBeVisible();
            await expect(page.locator(".signal-strip").getByText("2", { exact: true })).toBeVisible();
            await capture(page, "phase3d-workspace.png");
          });'''
          new = '''test("workspace prioritizes current work and preparation facts", async ({ page }) => {
            await page.goto("/projects?user=alice");

            await expect(page.getByRole("heading", { name: "工作台" })).toBeVisible();
            await expect(page.getByRole("heading", { name: "当前工作" })).toBeVisible();
            await expect(page.getByRole("button", { name: "查看 run_alice_succeeded" })).toBeVisible();
            await expect(page.getByText("acct_alice", { exact: true }).first()).toBeVisible();
            await expect(page.getByText("可见分区", { exact: true })).toBeVisible();
            await expect(page.getByText("1 次运行需要处理", { exact: true })).toBeVisible();
            await capture(page, "phase3d-workspace.png");
          });'''
          if old not in text:
              raise SystemExit("workspace visual contract block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit generated static bundle and refreshed UI contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/visual.spec.js src/pilot107/web/static
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git commit -m "build(web): sync ux v2 static bundle and UI contract"
          git push origin HEAD:ux-v2-foundation
