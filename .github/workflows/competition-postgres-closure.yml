name: Competition PostgreSQL Closure

on:
  push:
    branches:
      - fix/competition-postgres-only-ci

permissions:
  contents: write

jobs:
  close-postgres-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository tooling
        run: uv sync --locked --extra dev --extra api

      - name: Retire SQLite production composition
        run: python scripts/retire-sqlite-runtime-authority.py

      - name: Remove one-shot migration machinery
        run: |
          rm scripts/retire-sqlite-runtime-authority.py
          rm .github/workflows/competition-postgres-closure.yml

      - name: Normalize changed Python sources
        run: |
          uv run ruff format src tests scripts
          uv run ruff check src tests scripts --fix --unsafe-fixes || true
          git diff --check

      - name: Commit PostgreSQL-only closure
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(storage): complete PostgreSQL-only runtime authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
