name: temp-experiment-shell-a7-validation

on:
  push:
    branches:
      - ux-v2-experiment-shell-a7-validation
    paths:
      - scripts/_temp_apply_experiment_shell_a7.py
      - scripts/_temp_fix_experiment_shell_a7_types.py
      - scripts/_temp_fix_experiment_shell_a7_test.py
      - .github/workflows/_temp_experiment_shell_a7_validation.yml

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-experiment-shell-a7-validation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply staged A7 experiment-shell migration
        run: python scripts/_temp_apply_experiment_shell_a7.py

      - name: Apply strict TypeScript corrections
        run: python scripts/_temp_fix_experiment_shell_a7_types.py

      - name: Align targeted browser gate with current diagnosis contract
        run: python scripts/_temp_fix_experiment_shell_a7_test.py

      - name: Install web dependencies
        run: npm ci

      - name: Web static gates
        run: |
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Files workspace regression gate
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/ui/files.spec.js

      - name: Experiment shell workflow and query-boundary gate
        run: npx playwright test tests/ui/visual.spec.js --grep "experiment shell"

      - name: Verify materialized diff
        run: |
          test -f apps/web/src/ExperimentShell.tsx
          test -f apps/web/src/ExperimentShell.test.tsx
          test -f apps/web/src/styles/experiment-shell-v2.css
          grep -q 'function RunExperimentPage' apps/web/src/pages.tsx
          grep -q 'ExperimentShell' apps/web/src/StudioPage.tsx
          git diff --check
          git status --short

      - name: Commit validated A7 experiment shell
        run: |
          git config user.name "107Pilot validation bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/web/src/ExperimentShell.tsx \
            apps/web/src/ExperimentShell.test.tsx \
            apps/web/src/styles/experiment-shell-v2.css \
            apps/web/src/main.tsx \
            apps/web/src/StudioPage.tsx \
            apps/web/src/pages.tsx \
            tests/ui/visual.spec.js \
            src/pilot107/web/static
          git commit -m "feat(experiments): introduce lifecycle workspace shell"
          git push origin HEAD:ux-v2-experiment-shell-a7-validation
