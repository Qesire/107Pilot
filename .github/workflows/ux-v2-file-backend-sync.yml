name: ux-v2-file-backend-sync

on:
  push:
    branches:
      - ux-v2-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Align upload read model and add file workspace contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path("apps/web/src/types.ts")
          text = types.read_text()
          old = '''export type UploadSessionState =
            | "initialized"
            | "uploading"
            | "completing"
            | "completed"
            | "written"
            | "aborted"
            | "failed";'''
          new = '''export type UploadSessionState =
            | "initialized"
            | "uploading"
            | "assembled"
            | "verified"
            | "written"
            | "extracted"
            | "aborted"
            | "failed"
            // Compatibility with older control-plane/UI deployments.
            | "completing"
            | "completed";'''
          if old not in text:
              raise SystemExit("UploadSessionState block not found")
          types.write_text(text.replace(old, new, 1))

          spec = Path("tests/ui/visual.spec.js")
          text = spec.read_text()
          marker = 'test("run filters are URL-controlled and narrow the server query", async ({ page }) => {'
          new_test = '''test("file workspace consumes backend storage and upload session read models", async ({ page }) => {
            await page.goto("/files?user=alice");

            await expect(page.getByRole("heading", { name: "文件工作区" })).toBeVisible();
            await expect(page.getByText("个人存储", { exact: true })).toBeVisible();
            await expect(page.getByText("后台传输", { exact: true })).toBeVisible();
            await expect(page.getByText("dataset.tar.gz", { exact: true }).first()).toBeVisible();
            await expect(page.getByText(/完整性已验证，正在写入/)).toBeVisible();
            await expect(page.getByLabel("压缩包上传后处理")).toHaveValue("keep");
          });

          '''
          if new_test.strip() not in text:
              if marker not in text:
                  raise SystemExit("run-filter test marker not found")
              text = text.replace(marker, new_test + marker, 1)

          route_marker = '''    if (url.pathname === "/api/v1/contracts/schema") {'''
          file_routes = '''    if (url.pathname === "/api/v1/files/usage") {
            return json(route, {
              home: "/public/home/alice",
              used_bytes: 1073741824,
              total_bytes: 2147483648,
              observed_at: "2026-09-03T04:00:00Z",
            });
          }
          if (url.pathname === "/api/v1/files/uploads") {
            return json(route, {
              items: [
                {
                  upload_id: "upload_visual_001",
                  owner: "alice",
                  target_path: "/public/home/alice",
                  filename: "dataset.tar.gz",
                  total_size: 100,
                  is_partial: false,
                  received_bytes: 100,
                  sha256_expected: null,
                  sha256_actual: "a".repeat(64),
                  state: "verified",
                  auto_extract: false,
                  created_at: "2026-09-03T04:00:00Z",
                  written_path: null,
                  extracted_members: null,
                  error: null,
                },
              ],
            });
          }
          if (url.pathname === "/api/v1/files") {
            const path = url.searchParams.get("path") || "/public/home/alice";
            return json(route, {
              path,
              entries: [
                { name: "dataset.tar.gz", type: "file", size: 100, mtime: 1788408000 },
              ],
            });
          }
          '''
          if file_routes.strip() not in text:
              if route_marker not in text:
                  raise SystemExit("API route insertion marker not found")
              text = text.replace(route_marker, file_routes + route_marker, 1)
          spec.write_text(text)
          PY
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit source contract and generated static bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/types.ts tests/ui/visual.spec.js src/pilot107/web/static
          if git diff --cached --quiet; then
            echo "Nothing to sync"
            exit 0
          fi
          git commit -m "build(web): sync file backend contract and static bundle"
          git push origin HEAD:ux-v2-foundation
