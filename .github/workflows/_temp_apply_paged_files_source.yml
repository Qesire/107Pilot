name: temp-apply-paged-files-source

on:
  push:
    branches: [ux-v2-foundation]
    paths:
      - scripts/_temp_apply_paged_files_source.py
      - scripts/_temp_fix_paged_files_source.py
      - .github/workflows/_temp_apply_paged_files_source.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-foundation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply source migration
        run: |
          python scripts/_temp_apply_paged_files_source.py
          python scripts/_temp_fix_paged_files_source.py
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Commit formal source changes
        run: |
          git config user.name "107Pilot UX bot"
          git config user.email "107pilot-ux-bot@users.noreply.github.com"
          git add apps/web/src/types.ts apps/web/src/api.ts apps/web/src/files/useFilePane.ts apps/web/src/files/FilePane.tsx apps/web/src/files/FilePickerDialog.tsx apps/web/src/files/MillerColumns.tsx apps/web/src/files/MoveDialog.tsx tests/ui/files.spec.js tests/ui/visual.spec.js src/pilot107/web/static
          git diff --cached --check
          git commit -m "feat(files): consume paged directory listings"
          git push origin HEAD:ux-v2-foundation
